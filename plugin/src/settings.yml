---
name: Is the Mountain Out?
framework_version: '3.4.0'
strategy: polling
refresh_interval: 15
no_screen_padding: 'no'
dark_mode: 'no'
polling_verb: get
polling_url: "https://is-the-mountain-out.5g5wqr7kzx-466.workers.dev/api/visibility?mountain={{ mountain | default: 'rainier' }}&viewpoint={% if mountain == 'hood' %}{{ hood_viewpoint | default: 'portland' }}{% else %}{{ rainier_viewpoint | default: 'seattle' }}{% endif %}&feedback={{ show_feedback_qr | default: 'false' }}"
polling_headers: ''
polling_body: ''
custom_fields:
  - keyname: author_bio
    name: About this recipe
    field_type: author_bio
    category: life
    description: >-
      Weather estimates for Mount Rainier / Tahoma and Mount Hood / Wy’east,
      with optional unverified community reports. Estimates are uncalibrated,
      and illustrations are not live camera images.<br/>
      Choose a mountain and viewpoint. The author's shared service supplies the
      data and artwork; no deployment, Cloudflare account or API key is needed.
      Refreshes every 15 minutes. Feedback reports are shared with other users
      at the same viewpoint.<br/>
      <a href="https://github.com/nikokoren/is_the_mountain_out/issues">Contact the author or report a problem</a>.
    github_url: https://github.com/nikokoren/is_the_mountain_out
    learn_more_url: https://github.com/nikokoren/is_the_mountain_out/blob/main/README.md
  - keyname: mountain
    name: Mountain to view
    field_type: select
    default: rainier
    options:
      - Mount Rainier / Tahoma: rainier
      - Mount Hood / Wy’east: hood
    conditional_validation:
      - when: rainier
        required: [rainier_viewpoint]
        hidden: [hood_viewpoint]
      - when: hood
        required: [hood_viewpoint]
        hidden: [rainier_viewpoint]
  - keyname: rainier_viewpoint
    name: Mount Rainier viewpoint
    optional: true
    field_type: select
    default: seattle
    options:
      - Seattle — Kerry Park: seattle
      - Tacoma — Ruston Way: tacoma
      - Paradise: paradise
  - keyname: hood_viewpoint
    name: Mount Hood viewpoint
    field_type: select
    optional: true
    default: portland
    options:
      - Portland — Pittock Mansion: portland
  - keyname: show_feedback_qr
    name: Show feedback QR on full screen
    field_type: boolean
    default: false
    description: Show an inline QR with a Submit report label in the full-screen bottom-right corner. Hidden in mashups.
